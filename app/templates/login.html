{% extends "base.html" %}
{% block title %}Login - GatePass{% endblock %}
{% block content %}
<div class="login-wrapper">
  <div class="login-card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h2 style="font-size: 1.5rem; font-weight: 700; color: #1e293b;">Sign In to GatePass</h2>
      <p style="font-size: 0.85rem; color: #64748b;">Smart Visitor & Delivery Management</p>
    </div>
    <form method="POST" action="/login">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="admin, guard_ramesh, resident_aarav" value="{{ username_val or '' }}" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>
      <div style="margin-top: 1.25rem;"><button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.65rem;">Sign In</button></div>
    </form>
    <div class="demo-creds">
      <strong>🔑 Demo Accounts:</strong>
      <div style="margin-top: 0.35rem; display: flex; flex-direction: column; gap: 0.25rem;">
        <div><strong>Admin:</strong> <code>admin</code> / <code>admin123</code></div>
        <div><strong>Security:</strong> <code>guard_ramesh</code> / <code>guard123</code></div>
        <div><strong>Resident:</strong> <code>resident_aarav</code> / <code>resident123</code></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
